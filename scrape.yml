name: Scrape Card Rush PSA Listings

on:
  schedule:
    - cron: '0 1 * * *'  # runs daily at 01:00 UTC (08:00 WIB)
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit and push cards.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cards.json
          git diff --cached --quiet || git commit -m "chore: update PSA listings $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
